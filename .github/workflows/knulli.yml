name: Knulli builds
run-name: knulli-${{ inputs.request_id || github.run_id }}

on:
  push:
    paths:
      - '.github/workflows/knulli.yml'
      - 'tools/knulli/**'
  workflow_dispatch:
    inputs:
      recipe:
        description: Package to build
        type: choice
        options: [launcher, '2048', auto]
        default: launcher
        required: true
      source_ref:
        description: Full game source commit
        type: string
      source_repository:
        description: Public GitHub owner/repository (auto recipe)
        type: string
      request_id:
        description: Launcher correlation ID
        type: string
      target_profile:
        description: Observed Knulli hardware and controller profile JSON (auto only)
        type: string
      license_acceptance:
        description: Explicit GUI acceptance bound to repository, source commit and license SHA-256
        type: string

permissions:
  contents: read

jobs:
  test-compiler-cache:
    if: github.event_name == 'push' || inputs.recipe == 'launcher'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the isolated compiler image
        run: docker build -t quiver-knulli-cross tools/knulli/cross
      - name: Verify C and C++ cache reuse and invalidation
        run: python3 tools/knulli/verify_ccache.py

  launcher:
    if: github.event_name == 'push' || inputs.recipe == 'launcher'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test Knulli integration
        run: |
          dotnet test QuiverLauncher.Tests/QuiverLauncher.Tests.csproj -c Release --filter 'FullyQualifiedName~Knulli'
          python3 -m unittest discover -s tools/knulli -p 'test_*.py'
      - name: Publish ARM64 launcher
        run: |
          dotnet publish QuiverLauncher.Desktop/QuiverLauncher.Desktop.csproj -c Release -r linux-arm64 --self-contained true -p:PublishTrimmed=false -o package/quiver-launcher
          cp tools/knulli/supervisor.py package/quiver-launcher/
          cp tools/knulli/device_profile.py package/quiver-launcher/
          cp 'tools/knulli/Quiver Launcher.sh' package/
          chmod +x 'package/Quiver Launcher.sh' package/quiver-launcher/QuiverLauncher.Desktop
          tar -C package -czf QuiverLauncher-knulli-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: QuiverLauncher-knulli-arm64
          path: QuiverLauncher-knulli-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30

  attempt-game:
    if: github.event_name == 'workflow_dispatch' && inputs.recipe == 'auto'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    concurrency:
      group: knulli-agent-${{ inputs.source_repository }}-${{ inputs.source_ref }}
      cancel-in-progress: false
    steps:
      - name: Require reasoning credentials
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          QUIVER_FORK_TOKEN: ${{ secrets.QUIVER_FORK_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error::Configure COPILOT_GITHUB_TOKEN with an authorized Copilot-enabled account. Unknown games now require the reasoning agent; there is no silent scripted fallback."
            exit 1
          fi
          if [ -z "$QUIVER_FORK_TOKEN" ]; then
            echo "::error::Configure QUIVER_FORK_TOKEN with permission to create forks, push source checkpoints and disable Actions on new forks."
            exit 1
          fi
      - name: Validate dispatch inputs
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate observed device profile before starting the agent
        env:
          TARGET_PROFILE: ${{ inputs.target_profile }}
        run: python3 tools/knulli/agent/build_agent.py --validate-profile
      - name: Resolve or create game fork and select saved checkpoint
        id: fork
        env:
          TARGET_PROFILE: ${{ inputs.target_profile }}
          QUIVER_FORK_TOKEN: ${{ secrets.QUIVER_FORK_TOKEN }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          LICENSE_ACCEPTANCE: ${{ inputs.license_acceptance }}
        run: python3 tools/knulli/agent/build_agent.py --resolve-fork
      - name: Check out saved game fork directly
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.fork.outputs.repository }}
          ref: ${{ steps.fork.outputs.commit }}
          submodules: recursive
          path: game-source
          persist-credentials: false
      - name: Verify restored fork source
        env:
          FORK_COMMIT: ${{ steps.fork.outputs.commit }}
        run: test "$(git -C game-source rev-parse HEAD)" = "$FORK_COMMIT"
      - name: Scope compiler cache to project and device
        id: ccache-scope
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          TARGET_PROFILE: ${{ inputs.target_profile }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          profile = json.dumps(json.loads(os.environ["TARGET_PROFILE"]), sort_keys=True)
          scope = hashlib.sha256((os.environ["SOURCE_REPOSITORY"].lower() + "\n" + profile).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"scope={scope}\n")
          PY
      - name: Restore compiler cache from previous attempts
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: attempt-output/ccache
          key: knulli-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/knulli/cross/**') }}-${{ steps.ccache-scope.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            knulli-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/knulli/cross/**') }}-${{ steps.ccache-scope.outputs.scope }}-
      - name: Prepare isolated cross compiler
        run: docker build -t quiver-knulli-cross tools/knulli/cross
      - name: Verify compiler cache reuse across fresh containers
        run: python3 tools/knulli/verify_ccache.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned reasoning SDK
        run: |
          python -m pip install -r tools/knulli/agent/requirements.txt
          python -m copilot download-runtime
      - name: Reason about build failures and controller support
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TARGET_PROFILE: ${{ inputs.target_profile }}
          QUIVER_FORK_TOKEN: ${{ secrets.QUIVER_FORK_TOKEN }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          LICENSE_ACCEPTANCE: ${{ inputs.license_acceptance }}
        run: |
          set -o pipefail
          mkdir -p attempt-output
          python tools/knulli/agent/build_agent.py 2>&1 | tee attempt-output/build.log
      - name: Save compiler cache even after a failed build
        if: always() && steps.compiler-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: attempt-output/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knulli-auto-report-${{ inputs.request_id }}
          path: |
            attempt-output/build.log
            attempt-output/agent-report.jsonl
            attempt-output/agent-error.txt
            attempt-output/attempt-*/build.log
            attempt-output/attempt-*/recipe/*
            attempt-output/round-*/agent-report.jsonl
            attempt-output/round-*/attempt-*/build.log
            attempt-output/round-*/attempt-*/recipe/*
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: knulli-auto-${{ inputs.request_id }}
          path: attempt-output/package/
          if-no-files-found: error
          retention-days: 30

  game:
    if: github.event_name == 'workflow_dispatch' && inputs.recipe == '2048'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: knulli-agent-libretro/libretro-2048-${{ inputs.source_ref }}
      cancel-in-progress: false
    steps:
      - name: Validate dispatch inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve or create known-recipe game fork
        id: fork
        env:
          QUIVER_FORK_TOKEN: ${{ secrets.QUIVER_FORK_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          PYTHONPATH=tools/knulli/agent python3 - <<'PY'
          import os
          from pathlib import Path
          from fork_store import ForkStore, GitHubApi
          store = ForkStore(Path("source"), "libretro/libretro-2048", os.environ["SOURCE_REF"],
                            {"recipe": "2048", "target": "linux-arm64"},
                            GitHubApi(os.environ["QUIVER_FORK_TOKEN"]))
          store.ensure_fork()
          store.write_checkout_outputs(Path(os.environ["GITHUB_OUTPUT"]))
          PY
      - name: Check out known-recipe fork directly
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.fork.outputs.repository }}
          ref: ${{ steps.fork.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Install ARM64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build the libretro game core
        run: |
          make -C source -f Makefile.libretro -j2 platform=unix \
            CC="aarch64-linux-gnu-gcc -mcpu=cortex-a53 -mtune=cortex-a53 -fsigned-char"
          aarch64-linux-gnu-readelf -h source/2048_libretro.so | grep 'Machine:.*AArch64'
          mkdir -p payload
          cp source/2048_libretro.so payload/
          cp source/COPYING payload/
          cp tools/knulli/2048.sh payload/launch.sh
          cp tools/knulli/2048.cfg payload/quiver-controls.cfg
          chmod +x payload/launch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: knulli-2048-${{ inputs.request_id }}
          path: payload/
          if-no-files-found: error
          retention-days: 30
